<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Language" content="en">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/root.css">
    <link rel="stylesheet" href="styles/admin.css">
    <link rel="stylesheet" href="https://cdn.cubing.net/v0/css/@cubing/icons/css">
    <link rel="icon" href="/images/compcubelogo.png">
    <title>Admin Dashboard | Competition Cubes</title>
</head>
<body>
    <div class="main">
        <h1>Admin Dashboard</h1>
        <div id="dashboard-div">
            <h3 id="loading-text">Loading...</h3>
            <div class="solve-entry template">
                <h2 class="solve-user">Username</h2>
                <h4 class="event-text"><span class="cubing-icon event-333"></span> 3x3 <span class="cubing-icon event-333"></span></h4>
                <h3 class="solve-time">Single: 0.00</h3>
                <h5 class="wca-pb">WCA Single: 00:00.00 | WCA Average: 00:00.00</h5>
                <div class="buttons-div">
                    <button class="ok-button">OK</button>
                    <button class="dnf-button">DNF</button>
                    <button class="ban-button">Ban</button>
                </div>
            </div>
        </div>
    </div>
</body>
<script type="module" src="scripts/dashboard.js"></script>
</html>
