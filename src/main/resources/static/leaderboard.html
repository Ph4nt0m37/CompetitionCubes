<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Language" content="en">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/root.css">
    <link rel="stylesheet" href="styles/site-header.css">
    <link rel="stylesheet" href="styles/leaderboard.css">
    <link rel="stylesheet" href="https://cdn.cubing.net/v0/css/@cubing/icons/css">
    <link rel="icon" href="/images/compcubelogo.png">
    <title>Leaderboard | Competition Cubes</title>
</head>
<body>
    <header id="header"></header>
    

    <div id="main">
        <h1>Rankings</h1>
        <div id="options-box">
            <div id="events-box">
                <button class="event-button" id="3x3-button" event="333"><span class="cubing-icon event-333"></span></button>
                <button class="event-button" id="2x2-button" event="222"><span class="cubing-icon event-222"></span></button>
                <!--
                <button class="event-button" id="4x4-button" event="4x4"><span class="cubing-icon event-444"></span></button>
                <button class="event-button" id="5x5-button" event="5x5"><span class="cubing-icon event-555"></span></button>
                <button class="event-button" id="6x6-button" event="6x6"><span class="cubing-icon event-666"></span></button>
                <button class="event-button" id="7x7-button" event="7x7"><span class="cubing-icon event-777"></span></button>
                <button class="event-button" id="3oh-button" event="3oh"><span class="cubing-icon event-333oh"></span></button>
                <button class="event-button" id="clock-button" event="clock"><span class="cubing-icon event-clock"></span></button>
                <button class="event-button" id="sq1-button" event="sq1"><span class="cubing-icon event-sq1"></span></button>
                <button class="event-button" id="skewb-button" event="skewb"><span class="cubing-icon event-skewb"></span></button>
                <button class="event-button" id="pyra-button" event="prya"><span class="cubing-icon event-pyram"></span></button>
                <button class="event-button" id="mega-button" event="mega"><span class="cubing-icon event-minx"></span></button>
                <button class="event-button" id="3bld-button" event="3bld"><span class="cubing-icon event-333bf"></span></button>
                -->
            </div>
            <div id="sorting-options-box">
                <button class="sorting-button" id="elo-button">ELO</button>
                <button class="sorting-button" id="single-button">Single</button>
                <button class="sorting-button" id="avg-button">Average</button>
            </div>
        </div>
        <div id="leaderboard-div">
            <div class="user-entry" id="leaderboard-key">
                <p class="leaderboard-key rank-text">#</p>
                <p class="leaderboard-key username-text">Username</p>
                <p class="leaderboard-key elo-text">ELO</p>
            </div>
            <div class="user-entry" id="user-entry-template">
                <p class="rank-text">1</p>
                <p class="username-text">Loading...</p>
                <p class="elo-text">0</p>
            </div>
        </div>
    </div>
</body>
<script type="module" src="scripts/navbar.js"></script>
<script type="module" src="scripts/leaderboard.js"></script>
</html>
