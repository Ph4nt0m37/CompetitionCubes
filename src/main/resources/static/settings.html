<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <link rel="stylesheet" href="styles/root.css">
    <link rel="stylesheet" href="styles/site-header.css">
    <link rel="stylesheet" href="styles/settings.css">
    <link rel="stylesheet" href="https://cdn.cubing.net/v0/css/@cubing/icons/css">
    <link rel="icon" href="/images/compcubelogo.png">
    <title>Settings | Competition Cubes</title>
</head>
<body>
    <header id="header"></header>
    
    <div class="notif-abs-div">
        <div id="notif-div">
            <p class="notification template">Notification</p>
        </div>
    </div>

    <div id="main">
        <h2 id="loading-text">Loading...</h2>
        <div class="hidden" id="settings-div">
            <h1>Settings</h1>
            <h2>General</h2>
                <div class="setting">
                    <h3>Username</h3>
                    <input type="text" id="username-input" name="username" placeholder="Choose a username" maxlength="50" autocomplete="off">
                    <p class="error hidden" id="change-username-text">You cannot change your username because<br>you have been warned for your username.</p>
                </div>
            <h2>Sound</h2>
                <div class="setting row">
                    <h3>Inspection Audio:</h3>
                    <label class="switch">
                        <input type="checkbox" id="inspection-audio-toggle">
                        <span class="slider round"></span>
                    </label>
                </div>
                <div class="setting row">
                    <h3>Match Sounds:</h3>
                    <label class="switch">
                        <input type="checkbox" id="match-sounds-toggle">
                        <span class="slider round"></span>
                    </label>
                </div>
            <h2>Private Matches</h2>
                <div class="setting row">
                    <h3>Accept Challenge Requests:</h3>
                    <label class="switch">
                        <input type="checkbox" id="challenge-req-toggle">
                        <span class="slider round"></span>
                    </label>
                </div>
            <h2>Privacy</h2>
                <div class="setting row">
                    <h3>Hide WCA Profile:</h3>
                    <label class="switch">
                        <input type="checkbox" id="hide-wca-toggle">
                        <span class="slider round"></span>
                    </label>
                </div>
            <button id="save-button">Save</button>
        </div>
    </div>
</body>
<script type="module" src="scripts/navbar.js"></script>
<script type="module" src="scripts/settings.js"></script>
</html>
